<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Dashboard</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <!--Dashboard-->
    <h1>Dashboard</h1>
    <div class="dashboard">
      <!--profile card-->
      <div class="profile-card">
        <h2 id="userName">Name</h2>
        <p id="userEmail">Email</p>
        <p id="favColor">Favorite color</p>
      </div>

      <!--update profile form-->
      <form id="userInputForm">
        <h2>Update Profile</h2>
        <input id="name" placeholder="Enter name" required />
        <input id="email" type="email" placeholder="Enter email" required />
        <input id="color" placeholder="Enter favorite color" />
        <button type="submit">Update</button>
      </form>

      <!--to-do list-->
      <div class="to-do list">
        <h2>My Tasks</h2>
        <form id="toDoListForm">
          <p>Enter a new assignment</p>
          <input id="priority" placeholder="Priority number" required />
          <input id="task" placeholder="Assignment name" required />
          <input id="class" placeholder="Course name or 'personal'" />
          <button type="submit">Add Task</button>
        </form>
        <button type="button" id="personal">Personal tasks</button>
        <button type="button" id="sortPriority">Sort by priority</button>
        <ul id="taskList"></ul>
      </div>

      <!-- Users -->
      <div class="userDisplay">
        <h2>Users</h2>
        <button id="viewAll">View All Users</button>
        <div id="users"></div>
      </div>
    </div>

    <!--JS file-->
    <script src="app.js"></script>
  </body>
</html>
